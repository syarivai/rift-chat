name: CI

on:
  push:
    branches: [main]

jobs:
  check:
    name: Type-check, lint, format, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Run the four gates
        run: npm run check
